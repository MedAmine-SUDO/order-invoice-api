name: Reset demo

# Wipes the live demo database and loads the demo data again. Vercel Cron does the same
# every day; this is for doing it now (e.g. right after a schema change).
on:
  workflow_dispatch:

jobs:
  reset:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.NEON_DATABASE_URL_UNPOOLED }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.0"
      - run: uv sync --frozen --no-dev
      - run: uv run --no-dev alembic upgrade head
      - run: uv run --no-dev python -m app.seed --reset
